name: Check Streams

on:
  schedule:
    - cron: '0 0 * * *'  # Diariamente à meia-noite UTC
  workflow_dispatch:     # Permite execução manual via interface do GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Executar verificação de streams
        run: python scripts/check_streams.py

      - name: Guardar relatório como artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-report-${{ github.run_number }}
          path: output/stream_status_report.json
          retention-days: 30

      - name: Criar resumo
        run: |
          echo "## 📊 Relatório de Verificação de Streams" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Executado em: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O relatório detalhado está disponível nos artifacts desta run." >> $GITHUB_STEP_SUMMARY
